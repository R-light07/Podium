<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="1200" cy="200" r="160" fill="rgba(255,255,255,0.06)" filter="url(#blur)"/>
  <circle cx="280"  cy="700" r="220" fill="rgba(0,0,0,0.18)"        filter="url(#blur)"/>

  <!-- Gradient overlay bottom (for legibility) -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#gradOverlay)"/>
  <defs>
    <linearGradient id="gradOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
  </defs>

  <!-- Big emoji centre -->
  <text x="800" y="440" font-size="280" text-anchor="middle" dominant-baseline="middle" opacity="0.85">🏃</text>

  <!-- Title -->
  <text x="80" y="780" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="1">
    MARATONA MAPUTO
  </text>

  <!-- Category tag -->
  <g transform="translate(80, 700)">
    <rect width="166" height="38" rx="19" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <text x="20" y="25" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="2">
      ATLETISMO
    </text>
  </g>

  <!-- Watermark -->
  <text x="1520" y="850" font-family="'Bebas Neue', sans-serif" font-size="36" text-anchor="end" fill="rgba(255,255,255,0.25)" letter-spacing="2">
    PODIUM
  </text>
</svg>